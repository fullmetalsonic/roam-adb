name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build, test, and run doctor
        shell: pwsh
        run: .\scripts\test-gateway.ps1

  android:
    name: Android test, APK, and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test, assemble debug APK, and lint
        shell: pwsh
        run: .\scripts\build-android.ps1
